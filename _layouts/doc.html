---
layout: default
---
<article class="wrap doc">
  <header class="doc-head">
    <p class="eyebrow">Documentation</p>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="doc-summary">{{ page.summary }}</p>{% endif %}
  </header>
  <div class="doc-body">
    {{ content }}
  </div>
</article>
